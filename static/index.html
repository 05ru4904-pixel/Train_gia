<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <title>Тренажёр ЕГЭ</title>
  <!-- Пути к статике только абсолютные: относительные Telegram запросит от корня
       и получит 404, приложение молча не запустится (playbook 5.1). -->
  <link rel="stylesheet" href="/static/fonts/manrope.css">
  <link rel="stylesheet" href="/static/app.css">
  <!-- SDK берём у Telegram, чтобы получать обновления, но держим локальную копию:
       без него Mini App не запустится вообще (playbook 5.2 про сторонние CDN). -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    if (!window.Telegram || !window.Telegram.WebApp) {
      document.write('<scr' + 'ipt src="/static/telegram-web-app.js"><\/scr' + 'ipt>');
    }
  </script>
</head>
<body>
  <!-- Сплэш — состояние по умолчанию. Экран выбирается только после ответа сервера,
       чтобы зарегистрированному пользователю не мигал не тот раздел (playbook 5.5). -->
  <div id="splash" class="splash">
    <div class="splash__dot"></div>
    <div class="splash__dot"></div>
    <div class="splash__dot"></div>
  </div>

  <div id="app" class="app" hidden>
    <header id="header" class="header">
      <button id="back" class="header__back" type="button" aria-label="Назад" hidden>←</button>
      <div class="header__titles">
        <div id="header-title" class="header__title">Подготовка к ЕГЭ</div>
        <div id="header-sub" class="header__sub">русский язык</div>
      </div>
    </header>

    <main id="screen" class="screen"></main>

    <!-- Таббар: плашка со стеклом, внутри три раздела и одна физическая линза
         жидкого стекла, которая между ними ездит. Профиль вынесен из строки в
         отдельную круглую кнопку справа: линза до неё не доезжает и не должна.
         Геометрию линзы целиком считает app.js по живым прямоугольникам
         кнопок — в разметке нет ни одной координаты. -->
    <nav id="tabbar" class="tabbar">
      <div class="tabbar__plate">
        <!-- Подложка активного раздела. Лежит ПОД кнопками: заливка сплошная,
             а подпись поверх неё остаётся настоящей и чёткой. Она и есть тело
             линзы на просвет — в покое хром-градиент, под пальцем белая.
             Геометрию и ход считает app.js, ровно те же, что у линзы. -->
        <div class="tabbar__pill" aria-hidden="true"></div>
        <div class="tabbar__row">
          <button class="tab" type="button" data-tab="trainer">
            <span class="tab__icon tab__icon--grid"><i></i><i></i><i></i><i></i></span>
            <span class="tab__label">Тренажёр</span>
          </button>
          <button class="tab" type="button" data-tab="cheats">
            <span class="tab__icon tab__icon--book"><i></i><i></i><i></i></span>
            <span class="tab__label">Шпаргалки</span>
          </button>
          <button class="tab" type="button" data-tab="stats">
            <span class="tab__icon tab__icon--bars"><i></i><i></i><i></i></span>
            <span class="tab__label">Статистика</span>
          </button>
        </div>

        <!-- Линза. Лежит НАД кнопками намеренно: в Chromium её фоном
             (backdrop) служат сами кнопки, и преломляется настоящий DOM.
             В WebKit backdrop-filter: url() молча не работает, поэтому там
             внутри линзы живёт зеркало — клоны тех же кнопок, которые
             MutationObserver держит в точном соответствии с оригиналом. -->
        <div class="tabbar__lens" aria-hidden="true">
          <div class="tabbar__fx"><div class="tabbar__mirror"></div></div>
          <div class="tabbar__sheen"></div>
        </div>
      </div>

      <!-- Профиль отдельной кнопкой, вне плашки: линза ходит только по трём
           разделам, а этот нажимается сам по себе. Материал тот же, что у
           плашки, поэтому читаются они как одна система. -->
      <button class="tabbar__side" type="button" data-tab="profile" aria-label="Профиль">
        <span class="tab__icon tab__icon--user"><i></i></span>
      </button>
    </nav>
  </div>

  <div id="dialog-root"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
